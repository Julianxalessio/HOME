<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>HOME</title>
        <meta name="description" content="Quick launch hub for my projects and profiles." />
        <meta name="theme-color" content="#7c5cff" />

        <!-- Favicon -->
        <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
        <link rel="alternate icon" href="./favicon.svg" />
        <link rel="mask-icon" href="./favicon.svg" color="#7c5cff" />

        <!-- Styles -->
        <link rel="stylesheet" href="./styles.css" />

        <!-- Open Graph -->
        <meta property="og:title" content="HOME" />
        <meta property="og:description" content="Quick launch hub for my projects and profiles." />
        <meta property="og:type" content="website" />
    </head>
    <body>
        <header class="site-header">
            <div class="header__inner">
                <div class="brand">
                    <img src="./logo.svg" width="48" height="48" alt="Site logo" class="brand__logo" />
                    <div class="brand__text">
                        <p class="brand__eyebrow">PERSONAL DASHBOARD</p>
                        <h1 class="brand__title">HOME</h1>
                    </div>
                </div>
                <span class="header__status"><span aria-hidden="true"></span> Online</span>
            </div>
        </header>

        <main class="container">
            <section aria-labelledby="nodes-heading">
                <div class="section-heading">
                    <div>
                        <p class="section-heading__eyebrow">K3S</p>
                        <h2 id="nodes-heading">Nodes</h2>
                    </div>
                </div>
                <div class="grid" id="nodes" aria-live="polite">
                    <p>Loading nodes...</p>
                </div>
            </section>
        </main>

        <main class="container">
            <section aria-labelledby="links-heading">
                <div class="section-heading">
                    <div>
                        <p class="section-heading__eyebrow">Traefik</p>
                        <h2 id="links-heading">Pages</h2>
                    </div>
                </div>
                <div class="grid" id="pages" aria-live="polite">
                    <p>Loading pages…</p>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <p>Built with care • <span class="year" id="year"></span></p>
        </footer>

        <script>
            const pagesContainer = document.getElementById('pages');
            const nodesContainer = document.getElementById('nodes');

            function renderCards(container, entries, emptyMessage, type) {
                if (entries.length === 0) {
                    container.textContent = emptyMessage;
                    return;
                }

                container.replaceChildren(
                    ...[...entries]
                        .sort((firstPage, secondPage) =>
                            (type === 'node' ? firstPage.Name : firstPage.title).localeCompare(
                                type === 'node' ? secondPage.Name : secondPage.title
                            )
                        )
                        .map((page) => {
                            const link = document.createElement('a');
                            link.className = 'card';
                            if (page.url) {
                                link.href = page.url;
                                link.target = '_blank';
                                link.rel = 'noopener noreferrer';
                            } else {
                                link.removeAttribute('href');
                            }
                            const title = type === 'node' ? page.Name : page.title;
                            link.setAttribute('aria-label', page.url
                                ? `Open ${title} in a new tab`
                                : title);

                            const content = document.createElement('div');
                            content.className = 'card__content';

                            const titleElement = document.createElement('h3');
                            titleElement.className = 'card__title';
                            titleElement.textContent = title;

                            const description = document.createElement('p');
                            description.className = 'card__desc';
                            description.textContent = type === 'node'
                                ? `${page['server-location']} · ${page['oracle-account']}`
                                : page.description;

                            const middleware = document.createElement('p');
                            middleware.className = 'card__middleware';
                            middleware.textContent = type === 'node'
                                ? `${page['Control-Plane or Agent']} · ${page['tailscale ip']}`
                                : `Middleware: ${page.middleware || 'none'}`;
                            
                            content.append(titleElement, description, middleware);
                            link.append(content);

                            if (type === 'page') {
                                const chevron = document.createElement('span');
                                chevron.className = 'card__chevron';
                                chevron.setAttribute('aria-hidden', 'true');
                                chevron.textContent = '↗';
                                link.append(chevron);
                            }

                            return link;
                        })
                );
            }

            function loadData(path, key, container, emptyMessage) {
                return fetch(path)
                .then((response) => {
                    if (!response.ok) {
                        throw new Error(`Could not load ${path} (${response.status})`);
                    }
                    return response.json();
                })
                .then((data) => {
                    if (!Array.isArray(data[key])) {
                        throw new Error(`${path} must contain a "${key}" array`);
                    }
                    renderCards(container, data[key], emptyMessage, key === 'nodes' ? 'node' : 'page');
                })
                .catch((error) => {
                    console.error(error);
                    container.textContent = `${key} could not be loaded.`;
                });
            }

            loadData('./nodes.json', 'nodes', nodesContainer, 'No nodes configured.');
            loadData('./pages.json', 'pages', pagesContainer, 'No pages configured.');

            document.getElementById('year').textContent = new Date().getFullYear();
        </script>
    </body>
    </html>
