<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOME</title>
    <meta name="description" content="Quick launch hub for my projects and profiles." />
    <meta name="theme-color" content="#7c5cff" />

    <!-- Favicon -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="./favicon.svg" />
    <link rel="mask-icon" href="./favicon.svg" color="#7c5cff" />

    <!-- Styles -->
    <link rel="preload" href="#" as="style" />
    <link rel="stylesheet" href="./styles.css" />

    <!-- Open Graph (optional) -->
    <meta property="og:title" content="HOME" />
    <meta property="og:description" content="Quick launch hub for my projects and profiles." />
    <meta property="og:type" content="website" />
</head>

<body>
    <header class="site-header">
        <div class="brand">
            <img src="./logo.svg" width="48" height="48" alt="Site logo" class="brand__logo" />
            <div class="brand__text">
                <h1 class="brand__title">HOME</h1>
                <p class="brand__tagline">Your quick launch pad</p>
            </div>
        </div>
    </header>

    <main class="container">
        <section aria-labelledby="links-heading">
            <h2 id="links-heading" class="visually-hidden">Links</h2>
            <div class="grid"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Built with care • <span class="year" id="year"></span></p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        const Websites = [
            { name: "Projektarbeit", url: "https://klassenbuch3pa.ch" },
            { name: "Bibliothek", url: "https://bibliothek.sites.lomdev.ch" },
            { name: "Tic Tac Toe", url: "https://ttt.sites.lomdev.ch" },
            { name: "Project Playground", url: "https://projject.sites.lomdev.ch" },
            { name: "Code Editor", url: "https://code-env.sites.lomdev.ch" },
            { name: "Abonemente", url: "http://144.24.253.207/index.html" },
            { name: "About Me", url: "https://me.sites.lomdev.ch" },
            { name: "OJDANL", url: "https://ojdanl.sites.lomdev.ch" }
        ];
        Websites.forEach(site => {
            element = document.createElement('a');
            element.classList.add('card');
            if (site.name === "OJDANL") {
                element.classList.add('disappear');
            };
            element.href = site.url;
            element.target = "_blank";
            element.rel = "noopener noreferrer";
            element.setAttribute('aria-label', `Open ${site.name} in a new tab`);
            div = document.createElement('div');
            div.classList.add('card__content');
            h3 = document.createElement('h3');
            h3.classList.add('card__title');
            h3.textContent = site.name;
            p = document.createElement('p');
            p.classList.add('card__desc');
            p.textContent = `Learn more about ${site.name}.`;
            div.appendChild(h3);
            div.appendChild(p);
            element.appendChild(div);
            chevron = document.createElement('span');
            chevron.classList.add('card__chevron');
            chevron.setAttribute('aria-hidden', 'true');
            element.appendChild(chevron);
            document.querySelectorAll('.grid')[0].appendChild(element);
        });
    </script>
</body>

</html>
